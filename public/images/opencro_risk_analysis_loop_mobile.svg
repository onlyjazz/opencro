<text x="185" y="464.6" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#0891B2">Identify Software</text>
<text x="185" y="496.6" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#0891B2">Components</text>
<text x="185" y="524.1" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#FFFFFF">Map application/product functions to</text>
<text x="185" y="549.1" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#FFFFFF">business assets. Decompose to</text>
<text x="185" y="574.1" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#FFFFFF">software components at risk</text>
<circle cx="100" cy="726.5" r="52" fill="#EA580C" filter="url(#softshadow)"/>
<circle cx="100" cy="726.5" r="46" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.55"/>
<text x="100" y="739.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="40" font-weight="800" fill="#FFFFFF">4</text>
<text x="185" y="677.6" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#EA580C">Classify</text>
<text x="185" y="709.6" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#EA580C">Vulnerabilities</text>
<text x="185" y="737.1" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#FFFFFF">Compute CVSS scores of software</text>
<text x="185" y="762.1" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#FFFFFF">components. Assign software problem</text>
<text x="185" y="787.1" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#FFFFFF">type classification.</text>
<circle cx="100" cy="917.0" r="52" fill="#DC2626" filter="url(#softshadow)"/>
<circle cx="100" cy="917.0" r="46" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.55"/>
<text x="100" y="930.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="40" font-weight="800" fill="#FFFFFF">5</text>
<text x="185" y="896.6" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#DC2626">Build the Threat Model</text>
<text x="185" y="924.1" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#FFFFFF">Identify threats. Map vulnerabilities</text>
<text x="185" y="949.1" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#FFFFFF">to assets</text>
<circle cx="100" cy="1107.5" r="52" fill="#7C3AED" filter="url(#softshadow)"/>
<circle cx="100" cy="1107.5" r="46" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.55"/>
<text x="100" y="1120.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="40" font-weight="800" fill="#FFFFFF">6</text>
<text x="185" y="1058.6" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#7C3AED">Build the Risk</text>
<text x="185" y="1090.6" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#7C3AED">Mitigation Plan</text>
<text x="185" y="1118.1" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#FFFFFF">Specify countermeasures for vulnerable</text>
<text x="185" y="1143.1" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#FFFFFF">components. Calculate prioritized risk</text>
<text x="185" y="1168.1" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#FFFFFF">mitigation plan</text>
<circle cx="100" cy="1304.5" r="52" fill="#CA8A04" filter="url(#softshadow)"/>
<circle cx="100" cy="1304.5" r="46" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.55"/>
<text x="100" y="1317.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="40" font-weight="800" fill="#FFFFFF">7</text>
<text x="185" y="1271.6" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#CA8A04">Validate Findings</text>
<text x="185" y="1299.1" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#FFFFFF">Validate current findings with other</text>
<text x="185" y="1324.1" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#FFFFFF">players in the company. Downgrade</text>
<text x="185" y="1349.1" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#FFFFFF">low-scoring items and escalate others</text>
