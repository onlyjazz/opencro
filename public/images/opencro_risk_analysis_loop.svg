<svg viewBox="0 0 2000 2000" preserveAspectRatio="xMidYMid meet" style="width:100%;height:auto;display:block;" xmlns="http://www.w3.org/2000/svg">
<defs>

    <filter id="softshadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.18"/>
    </filter>

</defs>
<circle cx="1000" cy="1000" r="480" fill="none" stroke="#94A3B8" stroke-width="2" stroke-dasharray="2 10" opacity="0.4"/>
<path d="M 883.9 534.3 A 480 480 0 0 0 708.3 618.8" fill="none" stroke="#16A34A" stroke-width="5" stroke-linecap="round" opacity="0.85"/>
<path d="M 563.5 800.4 A 480 480 0 0 0 520.1 990.4" fill="none" stroke="#0891B2" stroke-width="5" stroke-linecap="round" opacity="0.85"/>
<path d="M 571.8 1216.8 A 480 480 0 0 0 693.3 1369.2" fill="none" stroke="#EA580C" stroke-width="5" stroke-linecap="round" opacity="0.85"/>
<path d="M 902.5 1470.0 A 480 480 0 0 0 1097.5 1470.0" fill="none" stroke="#DC2626" stroke-width="5" stroke-linecap="round" opacity="0.85"/>
<path d="M 1306.7 1369.2 A 480 480 0 0 0 1428.2 1216.8" fill="none" stroke="#7C3AED" stroke-width="5" stroke-linecap="round" opacity="0.85"/>
<path d="M 1479.9 990.4 A 480 480 0 0 0 1436.5 800.4" fill="none" stroke="#CA8A04" stroke-width="5" stroke-linecap="round" opacity="0.85"/>
<path d="M 1291.7 618.8 A 480 480 0 0 0 1116.1 534.3" fill="none" stroke="#2563EB" stroke-width="5" stroke-linecap="round" opacity="0.85"/>

<text x="1000" y="986" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"
  font-size="34" font-weight="700" fill="#FFFFFF">The Risk Analysis</text>
<text x="1000" y="1026" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"
  font-size="34" font-weight="700" fill="#FFFFFF">Loop</text>
<text x="1000" y="1064" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"
  font-size="20" font-weight="500" fill="#CBD5E1" letter-spacing="2">7-STEP METHODOLOGY</text>

<circle cx="1000.0" cy="520.0" r="85" fill="#2563EB" filter="url(#softshadow)"/>
<circle cx="1000.0" cy="520.0" r="77" fill="none" stroke="#FFFFFF" stroke-width="2.5" opacity="0.55"/>
<text x="1000.0" y="538.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="64" font-weight="800" fill="#FFFFFF">1</text>
<text x="1000.0" y="285.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#2563EB">Set Scope</text>
<text x="1000.0" y="316.8" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#FFFFFF">Select a business unit,</text>
<text x="1000.0" y="345.8" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#FFFFFF">business functions, set</text>
<text x="1000.0" y="374.8" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#FFFFFF">time schedule, participants</text>
<circle cx="624.7" cy="700.7" r="85" fill="#16A34A" filter="url(#softshadow)"/>
<circle cx="624.7" cy="700.7" r="77" fill="none" stroke="#FFFFFF" stroke-width="2.5" opacity="0.55"/>
<text x="624.7" y="718.7" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="64" font-weight="800" fill="#FFFFFF">2</text>
<text x="495.7" y="491.8" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#16A34A">Identify Business</text>
<text x="495.7" y="527.8" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#16A34A">Assets</text>
<text x="495.7" y="559.6" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#FFFFFF">Decompose business unit into</text>
<text x="495.7" y="588.6" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#FFFFFF">data and functions at risk.</text>
<text x="495.7" y="617.6" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#FFFFFF">Valuate assets.</text>
<circle cx="532.0" cy="1106.8" r="85" fill="#0891B2" filter="url(#softshadow)"/>
<circle cx="532.0" cy="1106.8" r="77" fill="none" stroke="#FFFFFF" stroke-width="2.5" opacity="0.55"/>
<text x="532.0" y="1124.8" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="64" font-weight="800" fill="#FFFFFF">3</text>
<text x="371.2" y="1076.0" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#0891B2">Identify Software</text>
<text x="371.2" y="1112.0" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#0891B2">Components</text>
<text x="371.2" y="1143.8" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#FFFFFF">Map application/product</text>
<text x="371.2" y="1172.8" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#FFFFFF">functions to business assets.</text>
<text x="371.2" y="1201.8" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#FFFFFF">Decompose to software</text>
<text x="371.2" y="1230.8" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#FFFFFF">components at risk</text>
<circle cx="791.7" cy="1432.5" r="85" fill="#EA580C" filter="url(#softshadow)"/>
<circle cx="791.7" cy="1432.5" r="77" fill="none" stroke="#FFFFFF" stroke-width="2.5" opacity="0.55"/>
<text x="791.7" y="1450.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="64" font-weight="800" fill="#FFFFFF">4</text>
<text x="720.1" y="1581.1" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#EA580C">Classify</text>
<text x="720.1" y="1617.1" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#EA580C">Vulnerabilities</text>
<text x="720.1" y="1648.9" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#FFFFFF">Compute CVSS scores of</text>
<text x="720.1" y="1677.9" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#FFFFFF">software components. Assign</text>
<text x="720.1" y="1706.9" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#FFFFFF">software problem type</text>
<text x="720.1" y="1735.9" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#FFFFFF">classification.</text>
<circle cx="1208.3" cy="1432.5" r="85" fill="#DC2626" filter="url(#softshadow)"/>
<circle cx="1208.3" cy="1432.5" r="77" fill="none" stroke="#FFFFFF" stroke-width="2.5" opacity="0.55"/>
<text x="1208.3" y="1450.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="64" font-weight="800" fill="#FFFFFF">5</text>
<text x="1279.9" y="1581.1" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#DC2626">Build the</text>
<text x="1279.9" y="1617.1" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#DC2626">Threat Model</text>
<text x="1279.9" y="1648.9" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#FFFFFF">Identify threats. Map</text>
<text x="1279.9" y="1677.9" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#FFFFFF">vulnerabilities to assets</text>
<circle cx="1468.0" cy="1106.8" r="85" fill="#7C3AED" filter="url(#softshadow)"/>
<circle cx="1468.0" cy="1106.8" r="77" fill="none" stroke="#FFFFFF" stroke-width="2.5" opacity="0.55"/>
<text x="1468.0" y="1124.8" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="64" font-weight="800" fill="#FFFFFF">6</text>
<text x="1628.8" y="1090.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#7C3AED">Build the Risk</text>
<text x="1628.8" y="1126.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#7C3AED">Mitigation Plan</text>
<text x="1628.8" y="1158.3" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#FFFFFF">Specify countermeasures for</text>
<text x="1628.8" y="1187.3" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#FFFFFF">vulnerable components. Calculate</text>
<text x="1628.8" y="1216.3" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#FFFFFF">prioritized risk mitigation plan</text>
<circle cx="1375.3" cy="700.7" r="85" fill="#CA8A04" filter="url(#softshadow)"/>
<circle cx="1375.3" cy="700.7" r="77" fill="none" stroke="#FFFFFF" stroke-width="2.5" opacity="0.55"/>
<text x="1375.3" y="718.7" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="64" font-weight="800" fill="#FFFFFF">7</text>
<text x="1504.3" y="462.8" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#CA8A04">Validate</text>
<text x="1504.3" y="498.8" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#CA8A04">Findings</text>
<text x="1504.3" y="530.6" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#FFFFFF">Validate current findings with</text>
<text x="1504.3" y="559.6" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#FFFFFF">other players in the company.</text>
<text x="1504.3" y="588.6" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#FFFFFF">Downgrade low-scoring items</text>
<text x="1504.3" y="617.6" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#FFFFFF">and escalate others</text>
</svg>