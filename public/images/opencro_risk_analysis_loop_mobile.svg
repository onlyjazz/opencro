<text x="100" y="141.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="40" font-weight="800" fill="#FFFFFF">1</text>
<text x="185" y="95.6" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#2563EB">Set Scope</text>
<text x="185" y="123.1" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#FFFFFF">Select a business unit, business</text>
<text x="185" y="148.1" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#FFFFFF">functions, set time schedule,</text>
<text x="185" y="173.1" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#FFFFFF">participants</text>
