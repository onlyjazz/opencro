<circle cx="100" cy="313.0" r="46" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.55"/>
<text x="100" y="326.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="40" font-weight="800" fill="#FFFFFF">2</text>
<text x="185" y="276.6" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#16A34A">Identify Business</text>
<text x="185" y="308.6" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#16A34A">Assets</text>
<text x="185" y="336.1" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#FFFFFF">Decompose business unit into data</text>
<text x="185" y="361.1" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#FFFFFF">and functions at risk. Valuate assets.</text>
